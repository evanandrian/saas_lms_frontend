    SaveMasterRecordRequest:
      type: object
      required:
      - name
      - description
      - status
      properties:
        code:
          type: string
          description: 'Create only (locked afterwards). tenant_type: ^[a-z][a-z0-9_]{1,49}$, institution: ^[a-z0-9_-]{3,50}$ (tenant code), grade_level: ^[A-Z0-9_]{1,20}$, user: email, permission & notification_template: ^[a-z][a-z0-9_]*(\.[a-z0-9_]+)+$, others: ^[A-Z0-9_]{2,20}$'
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/MasterStatus'
        sort_order:
          type: integer
          minimum: 1
          description: education_level, grade_level (required)
        version:
          type: string
          maxLength: 50
          description: curriculum
        subject_group:
          $ref: '#/components/schemas/MasterSubjectGroup'
        education_level_code:
          type: string
          description: subject, grade_level (required); institution (optional)
        curriculum_code:
          type: string
          description: subject (optional)
        tenant_type_code:
          type: string
          description: institution (required)
        email:
          type: string
          description: institution (required, unique)
        phone:
          type: string
          description: institution, user (optional, 8-16 digits)
        data_region:
          $ref: '#/components/schemas/MasterDataRegion'
        address:
          type: string
          description: institution
        start_date:
          type: string
          format: date
          description: academic_year (required)
        end_date:
          type: string
          format: date
          description: academic_year (required, after start_date)
        is_current:
          type: boolean
          description: academic_year; saving true releases the previous current period
        account_kind:
          $ref: '#/components/schemas/MasterAccountKind'
        tenant_code:
          type: string
          description: user (required)
        role_code:
          type: string
          description: user (required)
        note:
          type: string
          description: user
        scope:
          $ref: '#/components/schemas/MasterRoleScope'
        module:
          $ref: '#/components/schemas/MasterPermissionModule'
        action:
          $ref: '#/components/schemas/MasterPermissionAction'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/MasterNotificationChannel'
          description: notification_template (at least one)
        subject:
          type: string
          maxLength: 200
          description: notification_template (required)
        body:
          type: string
          maxLength: 2000
          description: notification_template (required; variables nama_siswa, nama_tugas, tenggat, nama_kelas, nilai, nama_sekolah, kode_cluster, persen_terpakai, jumlah_db, maks_db, ambang)
        zone:
          type: string
          maxLength: 100
          description: cluster_region (e.g. ap-southeast-3a)
        outside_indonesia:
          type: boolean
          description: cluster_region (data stored outside Indonesia; UI shows a PDP warning)
        updated_at:
          type: string
          format: date-time
          description: Required on update; must equal the stored value
