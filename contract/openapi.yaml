        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClusterView'
        '400':
          $ref: '#/components/responses/ClusterError'
        '403':
          $ref: '#/components/responses/ClusterError'
        '422':
          $ref: '#/components/responses/ClusterError'
  /api/v1/platform/clusters/test:
    post:
      operationId: testPlatformClusterConnection
      tags:
      - clusters
      summary: Real connection test (pgx, 5 s timeout, SHOW server_version). Connection failure is ok=false, not an HTTP error.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterTestInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClusterTestResult'
        '400':
          $ref: '#/components/responses/ClusterError'
        '403':
          $ref: '#/components/responses/ClusterError'
        '404':
          $ref: '#/components/responses/ClusterError'
        '422':
          $ref: '#/components/responses/ClusterError'
  /api/v1/platform/clusters/{id}:
    put:
      operationId: updatePlatformCluster
      tags:
      - clusters
      summary: Update a cluster (code is fixed; empty password = keep). Connection changes require a passing re-test.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClusterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClusterView'
        '404':
          $ref: '#/components/responses/ClusterError'
        '422':
          $ref: '#/components/responses/ClusterError'
  /api/v1/platform/clusters/{id}/databases:
    get:
      operationId: listPlatformClusterDatabases
      tags:
      - clusters
      summary: Tenant databases on the cluster with their size (largest first); connects to the cluster.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClusterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClusterDatabaseList'
        '404':
          $ref: '#/components/responses/ClusterError'
        '503':
          $ref: '#/components/responses/ClusterError'
  /api/v1/platform/audit:
    get:
      operationId: listPlatformAudit
      tags:
      - audit
      summary: Audit log platform (BR-23) dengan filter & cursor seq (permission platform.audit.view)
      security:
      - bearerAuth: []
      parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 200}, description: 'Cari di action, entity_type, IP, request_id, id, details; `AUD-123`/`123` juga mencocokkan seq'}
      - {name: actor, in: query, schema: {type: string}, description: 'UUID user | `system` | `gateway`'}
      - {name: range, in: query, schema: {type: string, enum: [today, '7', '30', custom], default: '7'}, description: Rentang tanggal Asia/Jakarta}
      - {name: from, in: query, schema: {type: string, format: date}, description: Wajib bila range=custom}
      - {name: to, in: query, schema: {type: string, format: date}, description: 'Wajib bila range=custom; inklusif; from > to → 400 issue to/range_invalid'}
      - {name: module, in: query, schema: {type: string}, description: 'Daftar kode modul dipisah koma (applications,tenants,invoices,payments,clusters,plans,auth,master_data,navigation,audit)'}
      - {name: severity, in: query, schema: {type: string}, description: 'Daftar dipisah koma: info,warn,crit'}
      - {name: failed, in: query, schema: {type: string, enum: ['true', 'false']}, description: true = hanya yang gagal}
      - {name: before, in: query, schema: {type: integer, format: int64}, description: Cursor — ambil entri dengan seq < before (next_before halaman sebelumnya)}
      - {name: limit, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuditList'
        '400':
          $ref: '#/components/responses/AuditError'
        '403':
          $ref: '#/components/responses/AuditError'
  /api/v1/platform/audit/export:
    get:
      operationId: exportPlatformAudit
      tags:
      - audit
      summary: Ekspor CSV (UTF-8 BOM) sesuai filter, maks 50.000 baris; mencatat audit.export
      security:
      - bearerAuth: []
      parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 200}, description: 'Cari di action, entity_type, IP, request_id, id, details; `AUD-123`/`123` juga mencocokkan seq'}
      - {name: actor, in: query, schema: {type: string}, description: 'UUID user | `system` | `gateway`'}
      - {name: range, in: query, schema: {type: string, enum: [today, '7', '30', custom], default: '7'}, description: Rentang tanggal Asia/Jakarta}
      - {name: from, in: query, schema: {type: string, format: date}, description: Wajib bila range=custom}
      - {name: to, in: query, schema: {type: string, format: date}, description: 'Wajib bila range=custom; inklusif; from > to → 400 issue to/range_invalid'}
      - {name: module, in: query, schema: {type: string}, description: 'Daftar kode modul dipisah koma (applications,tenants,invoices,payments,clusters,plans,auth,master_data,navigation,audit)'}
      - {name: severity, in: query, schema: {type: string}, description: 'Daftar dipisah koma: info,warn,crit'}
      - {name: failed, in: query, schema: {type: string, enum: ['true', 'false']}, description: true = hanya yang gagal}
      responses:
        '200':
          description: 'CSV `id,waktu,pelaku,modul,aksi,entitas,tingkat,hasil,ip,request_id`; Content-Disposition attachment audit-log-YYYY-MM-DD.csv'
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/AuditError'
        '422':
          $ref: '#/components/responses/AuditError'
  /api/v1/platform/audit/verify:
    get:
      operationId: verifyPlatformAudit
      tags:
      - audit
      summary: Verifikasi rantai hash audit dari jangkar retensi sampai kepala rantai
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuditVerify'
        '403':
          $ref: '#/components/responses/AuditError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClusterId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    MasterKind:
      in: path
      name: master
      required: true
      schema:
        $ref: '#/components/schemas/MasterKind'
    NavigationRole:
      in: path
      name: role
      required: true
      schema:
        $ref: '#/components/schemas/NavigationRole'
    AccountArea:
      in: query
      name: area
      required: true
      description: Workspace area being opened; verified against the user's active memberships.
      schema:
        $ref: '#/components/schemas/AccountArea'
    OAuthProvider:
      in: path
      name: provider
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    AccountRequestId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      in: path
      name: paymentID
      required: true
      schema:
        type: string
        format: uuid
    BillingArea:
      in: query
      name: area
      required: true
      schema:
        type: string
        enum:
        - school_admin
        - teacher
  responses:
    AuditError:
      description: 'Audit error: invalid_filter (400, details [{field, code}] — range_invalid, invalid_date, required, invalid, too_long), export_too_large (422, details {max_rows}), forbidden, internal_error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    ClusterError:
      description: 'Error envelope. Cluster codes: `validation_failed` (422, details = [{field, code}]; codes required, invalid, too_short, out_of_range, code_taken, not_found (region_code), below_used (max_databases)), `connection_failed` (422, details = {error_code}; error_code = connection_dns | connection_refused | connection_auth | connection_tls | connection_timeout | connection_failed), `cluster_unreachable` (503, details = {error_code}; raw driver text is logged server-side with the request_id, never returned), `not_found` (404), `forbidden`, `invalid_request`, `internal_error`. Update/test: a changed host, port, admin_user or ssl_mode without a new password → `validation_failed` issue {field: password, code: required} (the stored password is only reused for the same endpoint).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    SchoolAdminError:
      description: 'Error envelope. School admin codes: `validation_failed` (details = [{field, code}]), `quota_students_exceeded` (402), `not_found`, `class_not_found` (404, class absent/outside active year/other tenant), `recipient_invalid` (422, reminder recipient not valid for the class), `audit_export_range_invalid` (422, export range > 90 days or from > to), `in_use` (409), `invalid_transition` (409), `invoice_partially_paid` (409, previous activation invoice already has succeeded payments), `invitation_invalid` (410), `forbidden`, `tenant_terminated` (403, tenant lifecycle terminated), `tenant_read_only` (423, tenant suspended/trial_expired — write methods rejected, GET allowed; POST /school/subscription/activation is exempt), `not_ready`, `tenant_maintenance` (503, cluster under maintenance), `rate_limited` (429, public invitation/activation endpoints; see SchoolRateLimited), `invalid_request`, `internal_error`. Import: `validation_failed` rows:too_many_rows / rows:duplicate_no.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    SchoolRateLimited:
      description: 'Too many attempts (`rate_limited`). Public credential endpoints are limited per client IP — failed credential attempts only (invalid/expired code or token; default 20 / 15 min, PUBLIC_AUTH_RATE_LIMIT_IP*; successful attempts are not counted and never reset it), optional total requests per IP (PUBLIC_AUTH_RATE_LIMIT_IP_TOTAL, default 0 = off) — and per target — activation username or invitation token (all attempts, default 5 / 15 min, PUBLIC_AUTH_RATE_LIMIT_TARGET*; reset after a successful attempt). Client IP comes from X-Forwarded-For only when the connection is from TRUSTED_PROXIES. details = {retry_after (seconds), retry_at (RFC 3339)}.'
      headers:
        Retry-After:
          description: Seconds until the current window ends.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    RegistrationError:
      description: 'Error envelope. Codes: `validation_failed` (details = [{field, code}]), `email_taken`, `invalid_code`, `too_many_attempts`, `resend_too_soon` (details.retry_at), `no_application`, `not_found`, `application_locked`, `invalid_transition`, `checks_incomplete`, `tenant_not_ready`, `gateway_unavailable`, `forbidden`, `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    ExamSessionError:
      description: 'Error envelope. Codes: `session_not_found`, `session_closed`, `SESSION_FULL`, `participant_not_found`, `validation_failed`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    DashboardError:
      description: 'Error envelope. Dashboard codes: `unknown_area` (400), `forbidden` (403, role has no such dashboard view), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    AccountError:
      description: 'Error envelope. Account codes: `invalid_request`, `invalid_area`, `forbidden`, `not_found`, `version_conflict`, `validation_failed` (details = AccountIssue[]), `wrong_current_password`, `password_change_locked`, `invalid_code`, `challenge_expired`, `resend_too_soon` (details.retry_at), `not_configured`, `nothing_pending`, `request_pending`, `two_factor_state`, `phone_required`, `current_session`, `self_review`, `account_locked` (details.retry_at), `oauth_not_linked`, `oauth_linked_elsewhere`, `oauth_state_invalid`, `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    AccountOverview:
      description: Account settings overview
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/AccountOverview'
    PasswordChallenge:
      description: OTP sent
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/PasswordChallenge'
    BackupCodes:
      description: New backup codes (shown once)
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/BackupCodesResult'
    OAuthStart:
      description: Provider consent URL
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: object
                required:
                - authorize_url
                properties:
                  authorize_url:
                    type: string
    LoginResult:
      description: Tokens, or a two-step challenge when verification is enabled
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/LoginResult'
    ApprovalInbox:
      description: Kotak Persetujuan
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Inbox'
    PlanError:
      description: 'Error envelope. Plan codes: `forbidden`, `not_found`, `invalid_request`, `version_conflict`, `in_use` (details = [{entity: subscription, count}]), `validation_failed` (details = MasterIssue[]), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MasterErrorResponse'
    Plan:
      description: One plan
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Plan'
    PlanList:
      description: Plans
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
    MasterError:
      description: 'Error envelope. Master data codes: `forbidden`, `not_found`, `invalid_request`, `version_conflict`, `in_use` (details = MasterUsage[]), `validation_failed` (details = MasterIssue[]), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MasterErrorResponse'
    MasterRecord:
      description: One master record
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/MasterRecord'
    MasterRecordList:
      description: Master records
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/MasterRecord'
    Error:
      description: 'Error envelope. Navigation codes: `forbidden`, `unknown_role`, `invalid_request`, `version_conflict`, `validation_failed` (with `details`), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NavigationLayout:
      description: Sidebar layout of a role
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/NavigationLayout'
    BillingError:
      description: Billing error (validation_failed, not_found, invalid_transition, invoice_partially_paid (409, void ditolak karena invoice sudah menerima pembayaran sukses), no_context, reminder_too_soon, gateway_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ClusterStatus:
      type: string
      enum:
      - available
      - full
      - draining
      - maintenance
      - retired
      description: full is computed automatically (available and used >= max; back to available when below). maintenance pauses tenant connections (503 tenant_maintenance).
    ClusterSSLMode:
      type: string
      enum:
      - verify-full
      - require
      - disable
    ClusterBackup:
      type: object
      required:
      - started_at
      - finished_at
      - status
      - databases
      - size_bytes
      properties:
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - running
          - succeeded
          - failed
        databases:
          type: integer
        size_bytes:
          type: integer
          format: int64
    ClusterView:
      type: object
      description: The admin password is never returned; has_password tells whether one is stored.
      required:
      - id
      - code
      - region_code
      - region_name
      - region_zone
      - outside_indonesia
      - pg_version
      - host
      - port
      - admin_user
      - has_password
      - ssl_mode
      - max_databases
      - used_databases
      - pool_size
      - warn_pct
      - status
      - backup_schedule
      - backup_retention_days
      - pitr
      - last_backup
      - last_connected_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        region_code:
          type: string
        region_name:
          type: string
        region_zone:
          type: string
        outside_indonesia:
          type: boolean
        pg_version:
          type: string
        host:
          type: string
        port:
          type: integer
        admin_user:
          type: string
        has_password:
          type: boolean
        ssl_mode:
          $ref: '#/components/schemas/ClusterSSLMode'
        max_databases:
          type: integer
        used_databases:
          type: integer
          description: Live tenant databases (tenants with db_name, not terminated)
        pool_size:
          type: integer
        warn_pct:
          type: integer
        status:
          $ref: '#/components/schemas/ClusterStatus'
        backup_schedule:
          type: string
          enum:
          - 6h
          - daily
          - weekly
        backup_retention_days:
          type: integer
          enum:
          - 7
          - 14
          - 30
          - 90
        pitr:
          type: boolean
        last_backup:
          allOf:
          - $ref: '#/components/schemas/ClusterBackup'
          nullable: true
        last_connected_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClusterRegion:
      type: object
      required:
      - code
      - name
      - zone
      - outside_indonesia
      properties:
        code:
          type: string
        name:
          type: string
        zone:
          type: string
        outside_indonesia:
          type: boolean
    ClusterList:
      type: object
      required:
      - clusters
      - regions
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterView'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/ClusterRegion'
    ClusterInput:
      type: object
      required:
      - region_code
      - host
      - port
      - admin_user
      - ssl_mode
      - max_databases
      - pool_size
      - warn_pct
      - status
      - backup_schedule
      - backup_retention_days
      - pitr
      properties:
        code:
          type: string
          pattern: '^[a-z0-9-]{4,24}$'
          description: Create only (ignored on update); unique (code_taken)
        region_code:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        admin_user:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 12
          description: Required on create; empty on update = keep the stored password
        ssl_mode:
          $ref: '#/components/schemas/ClusterSSLMode'
        max_databases:
          type: integer
          minimum: 1
          description: Must be >= used_databases on update (below_used)
        pool_size:
          type: integer
          minimum: 5
          maximum: 100
        warn_pct:
          type: integer
          minimum: 50
          maximum: 95
          multipleOf: 5
        status:
          type: string
          enum:
          - available
          - draining
          - maintenance
          description: Send available for a cluster shown as full; the server recomputes full.
        backup_schedule:
          type: string
          enum:
          - 6h
          - daily
          - weekly
        backup_retention_days:
          type: integer
          enum:
          - 7
          - 14
          - 30
          - 90
        pitr:
          type: boolean
    ClusterTestInput:
      type: object
      required:
      - host
      - port
      - admin_user
      - ssl_mode
      properties:
        cluster_id:
          type: string
          format: uuid
          description: With an empty password the stored password of this cluster is used
        host:
          type: string
        port:
          type: integer
        admin_user:
          type: string
        password:
          type: string
        ssl_mode:
          $ref: '#/components/schemas/ClusterSSLMode'
    ClusterTestResult:
      type: object
      required:
      - ok
      - pg_version
      - latency_ms
      - ssl
      - error_code
      - error
      properties:
        ok:
          type: boolean
        pg_version:
          type: string
          example: '16.4'
        latency_ms:
          type: integer
          format: int64
        ssl:
          type: boolean
          description: Whether the connection actually used TLS
        error_code:
          type: string
          description: Empty when ok; connection_dns | connection_refused | connection_auth | connection_tls | connection_timeout | connection_failed
        error:
          type: string
          description: Always empty (kept for compatibility). The raw driver message is only written to the server log with the request_id; clients must use error_code.
    ClusterDatabaseList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - db_name
            - tenant_code
            - tenant_name
            - size_bytes
            properties:
              db_name:
                type: string
              tenant_code:
                type: string
              tenant_name:
                type: string
              size_bytes:
                type: integer
                format: int64
    SchoolAcceptInput:
      type: object
      properties:
        tenant:
          type: string
        token:
          type: string
        password:
          type: string
    SchoolActivateInput:
      type: object
      properties:
        username:
          type: string
        code:
          type: string
        password:
          type: string
    SchoolActivationCode:
      type: object
      required:
      - name
      - username
      - code
      properties:
        name:
          type: string
        username:
          type: string
        code:
          type: string
    SchoolAssessmentsInput:
      type: object
      properties:
        use_default:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/SchoolPlanAssessment'
          type: array
        decimal_places:
          type: integer
          minimum: 0
          maximum: 2
          description: Rounding digits for final grades (BR-31, half-up). Optional; omitted keeps the current value. Stored; applied once automatic final-grade calculation exists.
        reason:
          type: string
