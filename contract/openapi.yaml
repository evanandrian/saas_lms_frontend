  /api/v1/school/audit:
    get:
      operationId: getSchoolAudit
      parameters:
      - in: query
        name: category
        description: 'academic = academic_year.* + class.* + subject.*; planning = planning.*; reminder = attendance.remind + report.remind; export = export.*'
        schema:
          type: string
          enum:
          - person
          - guardian
          - account
          - report
          - academic
          - planning
          - reminder
          - export
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: before
        description: Kursor opak next_before dari halaman sebelumnya (seq audit); kirim balik apa adanya.
        schema:
          type: string
      - in: query
        name: q
        description: Cari di aksi, nama pelaku, atau subjek (≤ 100 karakter, literal).
        schema:
          type: string
          maxLength: 100
      - in: query
        name: actor_role
        description: Peran pelaku; SYSTEM = aksi tanpa keanggotaan tenant (sistem/worker).
        schema:
          $ref: '#/components/schemas/SchoolAuditActorRole'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/SchoolAuditView'
                required:
                - data
                type: object
          description: OK
        default:
          $ref: '#/components/responses/SchoolAdminError'
      security:
      - bearerAuth: []
      summary: Tenant change history (delete/deactivate people, invitations, report cards)
      tags:
      - school-admin
  /api/v1/school/audit/export:
    get:
      operationId: exportSchoolAudit
      parameters:
      - in: query
        name: category
        description: 'academic = academic_year.* + class.* + subject.*'
        schema:
          type: string
          enum:
          - person
          - guardian
          - account
          - report
          - academic
          - planning
          - reminder
          - export
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      - in: query
        name: actor_role
        schema:
          $ref: '#/components/schemas/SchoolAuditActorRole'
      responses:
        '200':
          description: CSV (default 90 hari terakhir; rentang maksimal 90 hari)
          content:
