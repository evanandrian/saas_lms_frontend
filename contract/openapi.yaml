  /api/v1/school/setup/subjects:
    put:
      operationId: saveSchoolSetupSubjects
      description: >-
        Replace taught subjects + KKTP. Enabled subjects are validated first (validation_failed issues):
        code not matching the code format → {field: "code", code: "code_invalid"}; a code repeated in the
        request (case-insensitive) → {field: "code", code: "code_taken"}; trimmed name shorter than 2 Unicode
        code points → {field: "name", code: "required"}; KKTP outside 0–100 → {field: "kktp", code: "kktp_range"};
        no enabled subject → {field: "subjects", code: "subjects_required"}. A disabled subject still referenced
        by assignments, objectives, grades, schedule, or report cards yields validation_failed issue
        {field: "subjects.<CODE>", code: "subject_in_use"} and nothing is saved. Audited as subject.save
        {added, updated, removed}.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolSubjectsInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/SchoolSetupState'
                required:
                - data
                type: object
          description: OK
        default:
          $ref: '#/components/responses/SchoolAdminError'
      security:
      - bearerAuth: []
      summary: Step 5 subjects
      tags:
      - school-admin
