        '403':
          $ref: '#/components/responses/BillingError'
        '404':
          $ref: '#/components/responses/BillingError'
        '409':
          $ref: '#/components/responses/BillingError'
        '422':
          $ref: '#/components/responses/BillingError'
  /api/v1/platform/invoices/{id}:
    get:
      operationId: getPlatformInvoice
      tags:
      - invoices
      summary: Invoice detail (editor + print)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/InvoiceDetail'
        '403':
          $ref: '#/components/responses/BillingError'
        '404':
          $ref: '#/components/responses/BillingError'
    put:
      operationId: updateInvoiceDraft
      tags:
      - invoices
      summary: Update a draft (issued invoices are immutable)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDraftInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/InvoiceDetail'
        '400':
          $ref: '#/components/responses/BillingError'
        '403':
          $ref: '#/components/responses/BillingError'
        '404':
          $ref: '#/components/responses/BillingError'
        '409':
          $ref: '#/components/responses/BillingError'
        '422':
          $ref: '#/components/responses/BillingError'
    delete:
      operationId: deleteInvoiceDraft
      tags:
      - invoices
      summary: Delete a draft
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
        '403':
          $ref: '#/components/responses/BillingError'
        '404':
          $ref: '#/components/responses/BillingError'
        '409':
          $ref: '#/components/responses/BillingError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MasterKind:
      in: path
      name: master
      required: true
      schema:
        $ref: '#/components/schemas/MasterKind'
    NavigationRole:
      in: path
      name: role
      required: true
      schema:
        $ref: '#/components/schemas/NavigationRole'
    AccountArea:
      in: query
      name: area
      required: true
      description: Workspace area being opened; verified against the user's active memberships.
      schema:
        $ref: '#/components/schemas/AccountArea'
    OAuthProvider:
      in: path
      name: provider
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    AccountRequestId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      in: path
      name: paymentID
      required: true
      schema:
        type: string
        format: uuid
    BillingArea:
      in: query
      name: area
      required: true
      schema:
        type: string
        enum:
        - school_admin
        - teacher
  responses:
    RegistrationError:
      description: 'Error envelope. Codes: `validation_failed` (details = [{field, code}]), `email_taken`, `invalid_code`, `too_many_attempts`, `resend_too_soon` (details.retry_at), `no_application`, `not_found`, `application_locked`, `invalid_transition`, `checks_incomplete`, `tenant_not_ready`, `gateway_unavailable`, `forbidden`, `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    ExamSessionError:
      description: 'Error envelope. Codes: `session_not_found`, `session_closed`, `SESSION_FULL`, `participant_not_found`, `validation_failed`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    DashboardError:
      description: 'Error envelope. Dashboard codes: `unknown_area` (400), `forbidden` (403, role has no such dashboard view), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    AccountError:
      description: 'Error envelope. Account codes: `invalid_request`, `invalid_area`, `forbidden`, `not_found`, `version_conflict`, `validation_failed` (details = AccountIssue[]), `wrong_current_password`, `password_change_locked`, `invalid_code`, `challenge_expired`, `resend_too_soon` (details.retry_at), `not_configured`, `nothing_pending`, `request_pending`, `two_factor_state`, `phone_required`, `current_session`, `self_review`, `account_locked` (details.retry_at), `oauth_not_linked`, `oauth_linked_elsewhere`, `oauth_state_invalid`, `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountErrorResponse'
    AccountOverview:
      description: Account settings overview
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/AccountOverview'
    PasswordChallenge:
      description: OTP sent
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/PasswordChallenge'
    BackupCodes:
      description: New backup codes (shown once)
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/BackupCodesResult'
    OAuthStart:
      description: Provider consent URL
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: object
                required:
                - authorize_url
                properties:
                  authorize_url:
                    type: string
    LoginResult:
      description: Tokens, or a two-step challenge when verification is enabled
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/LoginResult'
    ApprovalInbox:
      description: Kotak Persetujuan
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Inbox'
    PlanError:
      description: 'Error envelope. Plan codes: `forbidden`, `not_found`, `invalid_request`, `version_conflict`, `in_use` (details = [{entity: subscription, count}]), `validation_failed` (details = MasterIssue[]), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MasterErrorResponse'
    Plan:
      description: One plan
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Plan'
    PlanList:
      description: Plans
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
    MasterError:
      description: 'Error envelope. Master data codes: `forbidden`, `not_found`, `invalid_request`, `version_conflict`, `in_use` (details = MasterUsage[]), `validation_failed` (details = MasterIssue[]), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MasterErrorResponse'
    MasterRecord:
      description: One master record
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/MasterRecord'
    MasterRecordList:
      description: Master records
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/MasterRecord'
    Error:
      description: 'Error envelope. Navigation codes: `forbidden`, `unknown_role`, `invalid_request`, `version_conflict`, `validation_failed` (with `details`), `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NavigationLayout:
      description: Sidebar layout of a role
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/NavigationLayout'
    BillingError:
      description: Billing error (validation_failed, not_found, invalid_transition, no_context, reminder_too_soon, gateway_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RequestDocument:
      type: object
      required:
      - id
      - file_name
      - content_type
      - created_at
      properties:
        id:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
    RequestLogEntry:
      type: object
      required:
      - actor
      - action
      - detail
      - created_at
      properties:
        actor:
          type: string
        action:
          type: string
          enum:
          - submitted
          - updated
          - cancelled
          - docs_requested
          - docs_uploaded
          - approved
          - declined
          - dismissed
          - applied
        detail:
          type: string
        created_at:
          type: string
          format: date-time
    RequestView:
      type: object
      required:
      - id
      - number
      - kind
      - status
      - identity_kind
      - from
      - to
      - reason
      - created_at
      - due_at
      - paused
      - docs_requested
      - docs_note
      - documents
      - decided_at
      - decided_by
      - decision_note
      - effective_at
      - log
      properties:
        id:
          type: string
        number:
          type: integer
          description: Display number (APV-<number>)
        kind:
          type: string
          enum:
          - name
          - identity
          - deletion
        status:
          type: string
          enum:
          - pending
          - need_docs
          - approved
          - declined
        identity_kind:
          type: string
          description: Identity type of the requester role (employee_id, nip, nuptk, nisn, nik)
        from:
          type: string
        to:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
          description: created_at + 72 h + time spent waiting for documents
        paused:
          type: boolean
        docs_requested:
          type: array
          items:
            type: string
        docs_note:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/RequestDocument'
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by:
          type: string
        decision_note:
          type: string
        effective_at:
          type: string
          format: date-time
          nullable: true
          description: Deletion only — the account is deactivated at this time
        log:
          type: array
          items:
            $ref: '#/components/schemas/RequestLogEntry'
    InboxRequester:
      type: object
      required:
      - id
      - name
      - email
      - role_name
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role_name:
          type: string
    InboxItem:
      allOf:
      - $ref: '#/components/schemas/RequestView'
      - type: object
        required:
        - requester
        - self
        properties:
          requester:
            $ref: '#/components/schemas/InboxRequester'
          self:
            type: boolean
    Inbox:
      type: object
      required:
      - approver_role
      - tenant_name
      - sla_hours
      - items
      properties:
        approver_role:
          type: string
          enum:
          - platform
          - principal
          - school_admin
        tenant_name:
          type: string
        sla_hours:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboxItem'
    InboxSummary:
      type: object
      required:
      - pending
      properties:
        pending:
          type: integer
          format: int64
    DocumentUpload:
      type: object
      required:
      - file_name
      - content_type
      - data
      properties:
        file_name:
          type: string
        content_type:
          type: string
          enum:
          - image/png
          - image/jpeg
          - application/pdf
        data:
          type: string
          description: Base64 file, max 5 MB
    DecisionRequest:
      type: object
      required:
      - note
      properties:
        note:
          type: string
    DeclineRequestInput:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
    DocsRequestInput:
      type: object
      required:
      - documents
      - note
      properties:
        documents:
          type: array
          items:
            type: string
        note:
          type: string
    BulkApproveRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
    BulkApproveResult:
      type: object
      required:
      - approved
      - inbox
      properties:
        approved:
          type: integer
        inbox:
          $ref: '#/components/schemas/Inbox'
    AccountArea:
      type: string
      enum:
      - platform
      - school_admin
      - teacher
      - student
      - guardian
    OAuthProvider:
      type: string
      enum:
      - google
      - belajar
    AccountIssue:
      type: object
      required:
      - field
      - code
      properties:
        field:
          type: string
        code:
          type: string
    AccountErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              description: AccountIssue[] for `validation_failed`; otherwise an object (remaining, retry_at).
    ClientInfo:
      type: object
      required:
      - browser
      - os
      - kind
      properties:
        browser:
          type: string
        os:
          type: string
        kind:
          type: string
          enum:
          - desktop
          - mobile
          - tablet
    AccountContext:
      type: object
      required:
      - area
      - tenant_code
      - tenant_name
      - role_name
      - identity_kind
      - approver
      - restricted
      properties:
        area:
          $ref: '#/components/schemas/AccountArea'
        tenant_code:
