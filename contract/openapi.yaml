openapi: 3.0.3
info:
  title: SaaS LMS API
  description: Foundation API for multi-tenant SaaS LMS
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local development server
paths:
  /health:
    get:
      summary: Health check
      description: Returns process liveness status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
  /ready:
    get:
      summary: Readiness check
      description: Returns dependency readiness status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ready
        '503':
          description: Service Unavailable
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Login
      description: 'Multi-session: each login is a new device session; other devices stay signed in. When two-step verification is on, the response is a challenge (`two_factor_required`) completed with `/auth/login/2fa`. 423 `account_locked` after 5 consecutive failures when lockout is on.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/LoginResult'
        '401':
          description: Unauthorized
        '423':
          $ref: '#/components/responses/AccountError'
  /api/v1/auth/me:
    get:
      summary: Current user info
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User info and memberships
        '401':
          description: '`invalid_token` (missing, invalid, or expired token) or `session_revoked` (the session was signed out on this device or from Pengaturan Akun).'
  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      description: Rotates the refresh token within the same session; a reused refresh token is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New Access and Refresh Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      refresh_token:
                        type: string
        '401':
          description: Unauthorized
  /api/v1/auth/logout:
    post:
      summary: Logout
      description: Ends the session of this device only; other devices are signed out from Pengaturan Akun.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
  /api/v1/tenant/institutions:
    get:
      summary: List Institutions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: A list of institutions
    post:
      summary: Create Institution
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                institution_type:
                  type: string
      responses:
        '201':
          description: Institution created
        '409':
          description: Quota exceeded
  /api/v1/tenant/institutions/{id}:
    get:
      summary: Get Institution
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Institution details
        '404':
          description: Not found
  /api/v1/institutions/{institutionID}/school-profile:
    get:
      summary: Get School Profile
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: School profile details
    post:
      summary: Create School Profile
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                npsn:
                  type: string
                address:
                  type: string
                district_code:
                  type: string
                principal_name:
                  type: string
                principal_employee_number:
                  type: string
                accreditation:
                  type: string
      responses:
        '201':
          description: School profile created
  /api/v1/institutions/{institutionID}/grade-levels:
    get:
      summary: List Grade Levels
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of grade levels
    post:
      summary: Create Grade Level
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                education_level_code:
                  type: string
                grade:
                  type: integer
                phase_code:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Grade level created
  /api/v1/institutions/{institutionID}/subjects:
    get:
      summary: List Subjects
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of subjects
    post:
      summary: Create Subject
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                subject_catalog_code:
                  type: string
                passing_criteria:
                  type: number
                sort_order:
                  type: integer
      responses:
        '201':
          description: Subject created
  /api/v1/institutions/{institutionID}/classes:
    get:
      summary: List Classes
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      - in: query
        name: academic_year_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of classes
    post:
      summary: Create Class
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                academic_year_id:
                  type: string
                grade_level_id:
                  type: string
                name:
                  type: string
                capacity:
                  type: integer
      responses:
        '201':
          description: Class created
  /api/v1/institutions/{institutionID}/learning-objectives:
    get:
      summary: List Learning Objectives
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      - in: query
        name: subject_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of learning objectives
    post:
      summary: Create Learning Objective
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: institutionID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id:
                  type: string
                phase_code:
                  type: string
                grade_level_id:
                  type: string
                code:
                  type: string
                description:
                  type: string
                sort_order:
                  type: integer
      responses:
        '201':
          description: Learning objective created
  /api/v1/platform/navigation/roles/{role}:
    parameters:
    - $ref: '#/components/parameters/NavigationRole'
    get:
      operationId: getNavigationLayout
      tags:
      - navigation
      summary: Load the sidebar layout of a role (Menu & navigasi)
      description: Returns every group and menu including hidden ones. The default FLIXARE layout is created on first load. Requires membership in the platform tenant with `platform.navigation.manage`.
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/NavigationLayout'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: saveNavigationLayout
      tags:
      - navigation
      summary: Save the whole sidebar layout of a role
      description: Replaces the layout in one transaction. Nodes without `id` are created, stored nodes missing from the request are deleted, array order is the display order. Every create/update/delete is written to `activity_log_g` with before/after data. `version` must equal the stored version (optimistic locking).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveNavigationLayoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/NavigationLayout'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/platform/navigation/roles/{role}/reset:
    parameters:
    - $ref: '#/components/parameters/NavigationRole'
    post:
      operationId: resetNavigationLayout
      tags:
      - navigation
      summary: Restore the default FLIXARE layout of a role
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetNavigationLayoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/NavigationLayout'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/navigation/sidebar/{role}:
    parameters:
    - $ref: '#/components/parameters/NavigationRole'
    get:
      operationId: getNavigationSidebar
      tags:
      - navigation
      summary: Visible sidebar of a role for the application shell
      description: Hidden groups/menus and groups without visible menus are omitted. Requires authentication only; hiding a menu is not an access boundary. `principal` and `homeroom` have their own sidebar although they share access areas with `school_admin` / `teacher`. Badge `approvals` = pending items in the school approval inbox (`GET /api/v1/approvals/summary`).
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/NavigationLayout'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/platform/master-data/{master}:
    parameters:
    - $ref: '#/components/parameters/MasterKind'
    get:
      operationId: listMasterRecords
      tags:
      - master-data
      summary: List records of a platform/general master (Master data)
      description: Includes inactive and archived records and, per record, how many other records reference it (`usage`). Requires membership in the platform tenant with `platform.master_data.manage`.
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MasterRecordList'
        '401':
          $ref: '#/components/responses/MasterError'
        '403':
          $ref: '#/components/responses/MasterError'
        '404':
          $ref: '#/components/responses/MasterError'
    post:
      operationId: createMasterRecord
      tags:
      - master-data
      summary: Add a master record
      description: Logged to `activity_log_g` as `master_data.<master>.create` with the new data.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMasterRecordRequest'
      responses:
        '201':
          $ref: '#/components/responses/MasterRecord'
        '400':
          $ref: '#/components/responses/MasterError'
        '401':
          $ref: '#/components/responses/MasterError'
        '403':
          $ref: '#/components/responses/MasterError'
        '404':
          $ref: '#/components/responses/MasterError'
        '422':
          $ref: '#/components/responses/MasterError'
  /api/v1/platform/master-data/{master}/{code}:
    parameters:
    - $ref: '#/components/parameters/MasterKind'
    - in: path
      name: code
      required: true
      schema:
        type: string
    put:
      operationId: updateMasterRecord
      tags:
      - master-data
      summary: Update a master record
      description: The code cannot be changed. `updated_at` must equal the stored value (optimistic locking, 409 `version_conflict`). Logged with before/after data.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMasterRecordRequest'
      responses:
        '200':
          $ref: '#/components/responses/MasterRecord'
        '400':
          $ref: '#/components/responses/MasterError'
        '401':
          $ref: '#/components/responses/MasterError'
        '403':
          $ref: '#/components/responses/MasterError'
        '404':
          $ref: '#/components/responses/MasterError'
        '409':
          $ref: '#/components/responses/MasterError'
        '422':
          $ref: '#/components/responses/MasterError'
    delete:
      operationId: deleteMasterRecord
      tags:
      - master-data
      summary: Delete an unused master record
      description: Rejected with 409 `in_use` (details = usage) while other records still reference it; archive it instead. Logged with the deleted data.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/MasterError'
        '403':
          $ref: '#/components/responses/MasterError'
        '404':
          $ref: '#/components/responses/MasterError'
        '409':
          $ref: '#/components/responses/MasterError'
  /api/v1/platform/plans:
    get:
      operationId: listPlans
      tags:
      - plans
      summary: List subscription plans (Master Paket)
      description: All plans with tiers, enabled feature flags, and the number of subscriptions using each plan. Requires membership in the platform tenant with `platform.plan.manage`.
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PlanList'
        '401':
          $ref: '#/components/responses/PlanError'
        '403':
          $ref: '#/components/responses/PlanError'
    post:
      operationId: createPlan
      tags:
      - plans
      summary: Create a subscription plan
      description: Logged to activity_log_g as `plan.create`.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlanRequest'
      responses:
        '201':
          $ref: '#/components/responses/Plan'
        '400':
          $ref: '#/components/responses/PlanError'
        '401':
          $ref: '#/components/responses/PlanError'
        '403':
          $ref: '#/components/responses/PlanError'
        '422':
          $ref: '#/components/responses/PlanError'
  /api/v1/platform/plans/{code}:
    parameters:
    - in: path
      name: code
      required: true
      description: Current plan code
      schema:
        type: string
    put:
      operationId: updatePlan
      tags:
      - plans
      summary: Update a subscription plan
      description: '`code` in the body may differ from the path only while the plan has no subscriptions (422 `locked`). `updated_at` must equal the stored value (409 `version_conflict`). Logged with before/after data as `plan.update`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlanRequest'
      responses:
        '200':
          $ref: '#/components/responses/Plan'
        '400':
          $ref: '#/components/responses/PlanError'
        '401':
          $ref: '#/components/responses/PlanError'
        '403':
          $ref: '#/components/responses/PlanError'
        '404':
          $ref: '#/components/responses/PlanError'
        '409':
          $ref: '#/components/responses/PlanError'
        '422':
          $ref: '#/components/responses/PlanError'
    delete:
      operationId: deletePlan
      tags:
      - plans
      summary: Delete a plan without subscriptions
      description: Rejected with 409 `in_use` while subscriptions use the plan; archive it instead. Tiers and feature flags are deleted with it. Logged as `plan.delete`.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/PlanError'
        '403':
          $ref: '#/components/responses/PlanError'
        '404':
          $ref: '#/components/responses/PlanError'
        '409':
          $ref: '#/components/responses/PlanError'
  /api/v1/auth/login/2fa:
    post:
      operationId: completeLoginTwoFactor
      tags:
      - auth
      summary: Complete a login that requires two-step verification
      description: Accepts the authenticator/WhatsApp code or a one-time backup code. Wrong codes count toward the temporary lockout. 401 `invalid_code` (details.remaining) or `challenge_expired`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginResult'
        '401':
          $ref: '#/components/responses/AccountError'
  /api/v1/auth/login/2fa/resend:
    post:
      operationId: resendLoginTwoFactor
      tags:
      - auth
      summary: Resend the WhatsApp login code (30 s cooldown)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginResult'
        '401':
          $ref: '#/components/responses/AccountError'
        '429':
          $ref: '#/components/responses/AccountError'
  /api/v1/auth/oauth/providers:
    get:
      operationId: listOAuthProviders
      tags:
      - auth
      summary: OAuth providers and whether they are configured
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProviderStatus'
  /api/v1/auth/oauth/{provider}/start:
    parameters:
    - $ref: '#/components/parameters/OAuthProvider'
    post:
      operationId: startOAuthLogin
      tags:
      - auth
      summary: Start signing in with a linked provider account
      responses:
        '200':
          $ref: '#/components/responses/OAuthStart'
        '409':
          $ref: '#/components/responses/AccountError'
  /api/v1/auth/oauth/complete:
    post:
      operationId: completeOAuth
      tags:
      - auth
      summary: Complete the provider callback (login or link)
      description: For `purpose = link` the bearer token of the account that started linking is required. Login only succeeds when the provider account is already linked (401 `oauth_not_linked`); 409 `oauth_linked_elsewhere`, 400 `oauth_state_invalid`, 423 `account_locked`.
      security:
      - {}
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCompleteRequest'
      responses:
        '200':
          description: Tokens, a two-step challenge, or the link result
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthCompleteResult'
        '400':
          $ref: '#/components/responses/AccountError'
        '401':
          $ref: '#/components/responses/AccountError'
        '409':
          $ref: '#/components/responses/AccountError'
        '423':
          $ref: '#/components/responses/AccountError'
  /api/v1/account:
    get:
      operationId: getAccountOverview
      tags:
      - account
      summary: Pengaturan Akun overview of the signed-in user
      description: Everything the settings page shows for one workspace area. The area is verified against the user's active memberships (403 `forbidden`, 400 `invalid_area`). Every mutation below returns the same overview so the page always reflects stored data.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AccountArea'
      responses:
        '200':
          $ref: '#/components/responses/AccountOverview'
        '400':
          $ref: '#/components/responses/AccountError'
        '401':
          $ref: '#/components/responses/AccountError'
        '403':
          $ref: '#/components/responses/AccountError'
  /api/v1/account/workspace:
    get:
      operationId: getAccountWorkspace
      tags:
      - account
      summary: Workspace identity for one area (tenant card, user card, greeting, menu badges)
      description: Tenant (name, type, latest plan) and the signed-in user with the active role for the area, verified against active memberships. `badges` carries only menu badge codes whose data exists (`apps` = tenant applications awaiting a decision, for reviewers on the platform area).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AccountArea'
      responses:
        '200':
          description: Workspace identity
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AccountWorkspace'
        '400':
          $ref: '#/components/responses/AccountError'
        '401':
          $ref: '#/components/responses/AccountError'
        '403':
          $ref: '#/components/responses/AccountError'
  /api/v1/account/photo:
    get:
      operationId: getAccountPhoto
      tags:
      - account
      summary: Profile photo of the signed-in user (PNG/JPEG)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/AccountError'
  /api/v1/account/profile:
    put:
      operationId: updateAccountProfile
      tags:
      - account
      summary: Save the profile
      description: Nickname, gender, birth date, address, phone, and photo are saved directly. A new email waits for its verification link; full name and identity number wait for reviewer approval. Students may only change phone and photo (422 `restricted`). `updated_at` must match (409 `version_conflict`). Logged as `account.profile.update`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AccountArea'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Saved profile and follow-up actions
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProfileResult'
        '409':
          $ref: '#/components/responses/AccountError'
        '422':
          $ref: '#/components/responses/AccountError'
  /api/v1/account/email/resend:
    post:
      operationId: resendEmailVerification
      tags:
      - account
      summary: Resend the verification link to the pending email (30 s cooldown)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AccountArea'
      responses:
        '200':
          $ref: '#/components/responses/AccountOverview'
        '409':
          $ref: '#/components/responses/AccountError'
        '429':
          $ref: '#/components/responses/AccountError'
  /api/v1/account/email/pending:
    delete:
      operationId: cancelEmailChange
      tags:
      - account
      summary: Cancel the pending email change
      security:
